name: Validate and publish GSync Limited 0.3.0
on:
  pull_request:
    branches: [main]
    paths: ['main.js','manifest.json','scripts/**','.github/workflows/publish-limited.yml']
  push:
    branches: [main]
    paths: ['main.js','manifest.json','versions.json','scripts/**','.github/workflows/publish-limited.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and full regression suite
        run: |
          node --check main.js
          node scripts/release-smoke.cjs
          node scripts/shared-mode-tests.cjs
          node -e "let m=require('./manifest.json');if(m.id!=='gsync-limited'||m.version!=='0.3.0'||m.isDesktopOnly)process.exit(1)"
          sha256sum main.js manifest.json
      - name: Publish BRAT release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 0.3.0 >/dev/null 2>&1; then
            gh release upload 0.3.0 main.js manifest.json --clobber
          else
            gh release create 0.3.0 main.js manifest.json --title 'GSync Limited 0.3.0 (shared-folder beta)' --notes 'BETA: dedicated Google account + shared folder full Drive scope; token-expiry reauthentication prompts; per-folder sync preview and conflict backups. Never authenticate with your personal main account: full Drive permission is requested. Google OAuth and iPhone live integration are not verified by CI. Back up and use a disposable vault for the first sync.' --prerelease --target main
          fi

name: Validate and publish GSync Limited prerelease
on:
  push:
    branches: [main]
    paths:
      - main.js
      - manifest.json
      - versions.json
      - scripts/release-smoke.cjs
      - .github/workflows/publish-limited.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and regression checks
        run: |
          node --check main.js
          node scripts/release-smoke.cjs
          grep -q '"id": "gsync-limited"' manifest.json
          grep -q '"version": "0.2.3"' manifest.json
          test -s main.js
          sha256sum main.js manifest.json
      - name: Publish BRAT prerelease 0.2.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 0.2.3 >/dev/null 2>&1; then
            gh release upload 0.2.3 main.js manifest.json --clobber
          else
            gh release create 0.2.3 main.js manifest.json --title 'GSync Limited 0.2.3 (experimental)' --notes 'Setup clarity: required vs advanced options, read-only file visibility scan, explicit warning about limited drive.file grants, and hard stop when an external folder has no individual grants. Warning: selected folder does not grant all descendants. Not verified for full automatic sync. Do not use on your only copy of notes.' --prerelease --target main
          fi

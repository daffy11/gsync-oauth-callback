name: Check shared-folder prototype
on:
  push:
    branches: [main]
    paths:
      - scripts/shared-folder-mode.py
      - .github/workflows/check-shared.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/shared-folder-mode.py
      - run: node --check main.js
      - run: node scripts/release-smoke.cjs

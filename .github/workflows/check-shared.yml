name: Check shared-folder integration
on:
  push:
    branches: ['fix/shared-folder-auth-0.3']
    paths: ['scripts/shared-folder-mode.py','.github/workflows/check-shared.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/shared-folder-mode.py
      - run: node --check main.js
      - run: node scripts/release-smoke.cjs

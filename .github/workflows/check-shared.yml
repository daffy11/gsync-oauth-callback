name: Shared-folder regression and bug-hunt
on:
  push:
    branches: ['fix/shared-folder-auth-0.3']
    paths: ['main.js','scripts/shared-mode-tests.cjs','.github/workflows/check-shared.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: node --check main.js
      - name: Existing sync safety regressions
        run: node scripts/release-smoke.cjs
      - name: Shared-folder and OAuth expiry regressions
        run: node scripts/shared-mode-tests.cjs
